name: Deploy Mercedes EIS Tool

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mercedes-eis-tool-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to self-hosted Linux runner
    runs-on: self-hosted
    timeout-minutes: 60

    env:
      SOLUTION_PATH: MercedesEISTool.sln
      SERVER_PROJECT_PATH: MercedesEISTool.Server/MercedesEISTool.Server.csproj
      RELEASE_ROOT: /opt/mercedes-eis-tool/releases
      CURRENT_LINK: /opt/mercedes-eis-tool/current
      SERVICE_NAME: mercedes-eis-tool
      RELEASE_NAME: ${{ github.run_number }}
      RELEASE_PATH: /opt/mercedes-eis-tool/releases/${{ github.run_number }}

    steps:
      - name: Fail fast on any error
        shell: bash
        run: |
          set -euo pipefail

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify dotnet SDK is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "dotnet is not installed or not on PATH on the self-hosted runner." >&2
            exit 1
          fi
          echo "which dotnet"
          which dotnet
          echo "dotnet --info"
          dotnet --info

      - name: Restore solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "$SOLUTION_PATH"

      - name: Build solution in Release mode
        shell: bash
        run: |
          set -euo pipefail
          dotnet build -c Release "$SOLUTION_PATH" --no-restore

      - name: Prepare deployment target
        shell: bash
        run: |
          set -euo pipefail

          if ! sudo -n true; then
            echo "Passwordless sudo is required for deployment preparation on the runner." >&2
            exit 1
          fi

          for path in /opt/mercedes-eis-tool /opt/mercedes-eis-tool/releases /var/lib/mercedes-eis-tool /var/lib/mercedes-eis-tool/database; do
            if ! sudo -n mkdir -p "$path"; then
              echo "Creating directory $path requires additional sudo permissions on the runner." >&2
              exit 1
            fi
          done

          if ! sudo -n chown -R eaittonen:eaittonen /opt/mercedes-eis-tool /var/lib/mercedes-eis-tool; then
            echo "Changing ownership for /opt/mercedes-eis-tool or /var/lib/mercedes-eis-tool requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          if ! sudo -n chmod 755 /opt/mercedes-eis-tool /opt/mercedes-eis-tool/releases /var/lib/mercedes-eis-tool /var/lib/mercedes-eis-tool/database; then
            echo "Setting permissions on deployment directories requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          if ! sudo -n chmod 775 /var/lib/mercedes-eis-tool/database; then
            echo "Setting writable permissions on /var/lib/mercedes-eis-tool/database requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          for path in /opt/mercedes-eis-tool /var/lib/mercedes-eis-tool/database; do
            temp_file="$path/.deployment-write-test"
            if ! sudo -n sh -c "touch '$temp_file' && rm -f '$temp_file'"; then
              echo "Unable to create and remove a temporary file in $path. Check ownership and permissions." >&2
              exit 1
            fi
          done

      - name: Publish release into a new directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$RELEASE_PATH" ]; then
            echo "Release directory already exists: $RELEASE_PATH" >&2
            exit 1
          fi

          dotnet publish "$SERVER_PROJECT_PATH" \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o "$RELEASE_PATH"

          if [ ! -f "$RELEASE_PATH/MercedesEISTool.Server.dll" ]; then
            echo "Publish did not produce MercedesEISTool.Server.dll" >&2
            exit 1
          fi

      - name: Switch current symlink to the new release
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_LINK=""
          if [ -L "$CURRENT_LINK" ]; then
            PREVIOUS_LINK="$(readlink -f "$CURRENT_LINK" || true)"
          fi

          if ! sudo -n ln -sfn "$RELEASE_PATH" "$CURRENT_LINK"; then
            echo "Updating the $CURRENT_LINK symlink requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          if ! sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"; then
            echo "Restarting systemd service $SERVICE_NAME requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if sudo -n /usr/bin/systemctl is-active --quiet "$SERVICE_NAME" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if ! sudo -n /usr/bin/systemctl is-active --quiet "$SERVICE_NAME" >/dev/null 2>&1; then
            echo "Service failed to start after deployment" >&2
            echo "== systemctl status --no-pager $SERVICE_NAME ==" >&2
            if ! sudo -n /usr/bin/systemctl status --no-pager "$SERVICE_NAME"; then
              echo "Reading systemctl status for $SERVICE_NAME requires additional sudo permissions on the runner." >&2
            fi
            echo "== journalctl -u $SERVICE_NAME -n 100 --no-pager ==" >&2
            if ! sudo -n /usr/bin/journalctl -u "$SERVICE_NAME" -n 100 --no-pager; then
              echo "Reading journalctl output for $SERVICE_NAME requires additional sudo permissions on the runner." >&2
            fi
            if [ -n "$PREVIOUS_LINK" ] && [ -d "$PREVIOUS_LINK" ]; then
              if ! sudo -n ln -sfn "$PREVIOUS_LINK" "$CURRENT_LINK"; then
                echo "Reverting the $CURRENT_LINK symlink requires additional sudo permissions on the runner." >&2
              fi
              if ! sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"; then
                echo "Restarting systemd service $SERVICE_NAME after rollback requires additional sudo permissions on the runner." >&2
              fi
            fi
            exit 1
          fi

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/api/health || true)
            if [ "$status" = "200" ]; then
              echo "Health endpoint returned HTTP 200"
              exit 0
            fi
            echo "Waiting for health endpoint (attempt $attempt/30)..."
            sleep 1
          done
          echo "Deployment verification failed: health endpoint did not return HTTP 200" >&2
          exit 1

      - name: Prune old releases
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo -n mkdir -p "$RELEASE_ROOT"; then
            echo "Creating release directory $RELEASE_ROOT requires additional sudo permissions on the runner." >&2
            exit 1
          fi
          mapfile -t releases < <(find "$RELEASE_ROOT" -mindepth 1 -maxdepth 1 -type d | sort -V)
          keep_count=5
          if [ "${#releases[@]}" -gt "$keep_count" ]; then
            excess_count=$(( ${#releases[@]} - keep_count ))
            for (( index=0; index < excess_count; index++ )); do
              rm -rf "${releases[$index]}"
            done
          fi

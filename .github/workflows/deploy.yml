name: Deploy Mercedes EIS Tool

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mercedes-eis-tool-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to self-hosted Linux runner
    runs-on: self-hosted
    timeout-minutes: 60

    env:
      SOLUTION_PATH: MercedesEISTool.sln
      SERVER_PROJECT_PATH: MercedesEISTool.Server/MercedesEISTool.Server.csproj
      RELEASE_ROOT: /opt/mercedes-eis-tool/releases
      CURRENT_LINK: /opt/mercedes-eis-tool/current
      SERVICE_NAME: mercedes-eis-tool
      RELEASE_NAME: ${{ github.run_number }}
      RELEASE_PATH: /opt/mercedes-eis-tool/releases/${{ github.run_number }}

    steps:
      - name: Fail fast on any error
        shell: bash
        run: |
          set -euo pipefail

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify dotnet SDK is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "dotnet is not installed or not on PATH on the self-hosted runner." >&2
            exit 1
          fi
          echo "which dotnet"
          which dotnet
          echo "dotnet --info"
          dotnet --info

      - name: Restore solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "$SOLUTION_PATH"

      - name: Build solution in Release mode
        shell: bash
        run: |
          set -euo pipefail
          dotnet build -c Release "$SOLUTION_PATH" --no-restore

      - name: Prepare deployment target
        shell: bash
        run: |
          set -euo pipefail

          if ! sudo -n mkdir -p /opt/mercedes-eis-tool; then
            echo "Failed to create /opt/mercedes-eis-tool. Check the runner sudoers configuration." >&2
            exit 1
          fi
          if ! sudo -n mkdir -p /opt/mercedes-eis-tool/releases; then
            echo "Failed to create /opt/mercedes-eis-tool/releases. Check the runner sudoers configuration." >&2
            exit 1
          fi
          if ! sudo -n mkdir -p /var/lib/mercedes-eis-tool; then
            echo "Failed to create /var/lib/mercedes-eis-tool. Check the runner sudoers configuration." >&2
            exit 1
          fi
          if ! sudo -n mkdir -p /var/lib/mercedes-eis-tool/database; then
            echo "Failed to create /var/lib/mercedes-eis-tool/database. Check the runner sudoers configuration." >&2
            exit 1
          fi

      - name: Publish release into a new directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$RELEASE_PATH" ]; then
            echo "Release directory already exists: $RELEASE_PATH" >&2
            exit 1
          fi

          dotnet publish "$SERVER_PROJECT_PATH" \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o "$RELEASE_PATH"

          if [ ! -f "$RELEASE_PATH/MercedesEISTool.Server.dll" ]; then
            echo "Publish did not produce MercedesEISTool.Server.dll" >&2
            exit 1
          fi

      - name: Install server environment configuration
        shell: bash
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          set -euo pipefail
          sudo -n install -d -m 755 /etc/mercedes-eis-tool
          sudo -n install -d -m 755 /etc/systemd/system/mercedes-eis-tool.service.d
          sudo -n install -m 600 /dev/null /etc/mercedes-eis-tool/environment
          sudo -n tee /etc/mercedes-eis-tool/environment >/dev/null <<EOF
          VehicleLookup__RapidApiBaseUrl=https://ajoneuvon-tiedot.p.rapidapi.com
          VehicleLookup__RapidApiHost=ajoneuvon-tiedot.p.rapidapi.com
          VehicleLookup__RapidApiKey=${RAPIDAPI_KEY}
          EOF
          sudo -n tee /etc/systemd/system/mercedes-eis-tool.service.d/override.conf >/dev/null <<'EOF'
          [Service]
          EnvironmentFile=-/etc/mercedes-eis-tool/environment
          EOF
          sudo -n /usr/bin/systemctl daemon-reload

      - name: Switch current symlink to the new release
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_LINK=""
          if [ -L "$CURRENT_LINK" ]; then
            PREVIOUS_LINK="$(readlink -f "$CURRENT_LINK" || true)"
          fi

          if ! sudo -n ln -sfn "$RELEASE_PATH" "$CURRENT_LINK"; then
            echo "Updating the $CURRENT_LINK symlink requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          if ! sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"; then
            echo "Restarting systemd service $SERVICE_NAME requires additional sudo permissions on the runner." >&2
            exit 1
          fi

          for attempt in $(seq 1 15); do
            if /usr/bin/systemctl is-active --quiet "$SERVICE_NAME" >/dev/null 2>&1; then
              echo "Deployment completed successfully."
              exit 0
            fi
            sleep 1
          done

          echo "== systemctl status --no-pager $SERVICE_NAME ==" >&2
          sudo -n systemctl status --no-pager "$SERVICE_NAME" || true
          echo "== journalctl -u $SERVICE_NAME -n 200 --no-pager ==" >&2
          sudo -n journalctl -u "$SERVICE_NAME" -n 200 --no-pager || true
          echo "== ss -ltnp | grep 5080 ==" >&2
          sudo -n ss -ltnp | grep 5080 || true
          exit 1

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          health_url="http://127.0.0.1:5080/api/health"
          for attempt in $(seq 1 60); do
            status_output=$(curl -s -o /tmp/health-body.txt -w '%{http_code}' "$health_url" 2>/tmp/health-curl.err || true)
            status_code="${status_output:-000}"
            curl_error="$(cat /tmp/health-curl.err 2>/dev/null || true)"
            echo "Health check attempt $attempt/60 -> HTTP $status_code"
            if [ -n "$curl_error" ]; then
              echo "curl error: $curl_error"
            fi
            if [ "$status_code" = "200" ]; then
              echo "Health endpoint returned HTTP 200"
              exit 0
            fi
            if ! /usr/bin/systemctl is-active --quiet "$SERVICE_NAME" >/dev/null 2>&1; then
              echo "Application process exited unexpectedly during health verification." >&2
              echo "== systemctl status --no-pager $SERVICE_NAME ==" >&2
              sudo -n systemctl status --no-pager "$SERVICE_NAME" || true
              echo "== journalctl -u $SERVICE_NAME -n 200 --no-pager ==" >&2
              sudo -n journalctl -u "$SERVICE_NAME" -n 200 --no-pager || true
              echo "== ss -ltnp | grep 5080 ==" >&2
              sudo -n ss -ltnp | grep 5080 || true
              echo "== curl -v $health_url ==" >&2
              curl -v "$health_url" || true
              exit 1
            fi
            sleep 2
          done

          echo "Deployment verification failed: health endpoint did not return HTTP 200" >&2
          echo "== systemctl status --no-pager $SERVICE_NAME ==" >&2
          sudo -n systemctl status --no-pager "$SERVICE_NAME" || true
          echo "== journalctl -u $SERVICE_NAME -n 200 --no-pager ==" >&2
          sudo -n journalctl -u "$SERVICE_NAME" -n 200 --no-pager || true
          echo "== ss -ltnp | grep 5080 ==" >&2
          sudo -n ss -ltnp | grep 5080 || true
          echo "== curl -v $health_url ==" >&2
          curl -v "$health_url" || true
          exit 1

      - name: Prune old releases
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo -n mkdir -p "$RELEASE_ROOT"; then
            echo "Creating release directory $RELEASE_ROOT requires additional sudo permissions on the runner." >&2
            exit 1
          fi
          mapfile -t releases < <(find "$RELEASE_ROOT" -mindepth 1 -maxdepth 1 -type d | sort -V)
          keep_count=5
          if [ "${#releases[@]}" -gt "$keep_count" ]; then
            excess_count=$(( ${#releases[@]} - keep_count ))
            for (( index=0; index < excess_count; index++ )); do
              rm -rf "${releases[$index]}"
            done
          fi

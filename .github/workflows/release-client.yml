name: release-client

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish client
        run: |
          dotnet publish MercedesEISTool.GUI/MercedesEISTool.GUI.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./release-assets
          cp ./publish/MercedesEISTool.GUI.exe ./release-assets/MercedesEISTool.GUI.exe
          gh release create "${GITHUB_REF_NAME}" ./release-assets/MercedesEISTool.GUI.exe \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
